<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>site-jogo</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="menu">
      <img src="img/cinePlus.png" class="logo" alt="Logo do site" />
      <ul class="menu-list">
        <li>
          <a href="#"><span>Início</span></a>
        </li>
        <li>
          <a href="#"><span>Filmes</span></a>
        </li>
        <li>
          <a href="#"><span>Promoções</span></a>
        </li>
        <li>
          <a href="#"><span>Minha Conta</span></a>
        </li>
      </ul>
    </nav>
    <main class="cont">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="img/doomsday (2).png"
              class="d-block w-100"
              alt="Vingadores"
            />
            <button class="btn-btn-primary">Pré-venda</button>
          </div>

          <div class="carousel-item">
            <img src="img/duna3.png" class="d-block w-100" alt="Duna" />
            <button class="btn-btn-primary">Pré-venda</button>
          </div>

          <div class="carousel-item">
            <img
              src="img/brand_new_day.png"
              class="d-block w-100"
              alt="Terceiro filme"
            />
            <button class="btn-btn-primary">Ingressos</button>F
          </div>
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Anterior</span>
        </button>

        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Próximo</span>
        </button>
      </div>
    </main>
    <div class="venda">
      <h1>Em cartaz</h1>
      <div class="filmes">
        <div class="cards-filmes">
          <div class="cards-filmes-img-1">
            <p><a href="">Informações</a></p>
            <p><a href="">Ver trailer</a></p>
          </div>
          <div class="nome-filme">
            <p>Deadpool e Wolverine</p>
          </div>
          <button class="btn-filmes">Ingressos</button>
        </div>
        <div class="cards-filmes">
          <div class="cards-filmes-img-2">
            <p><a href="">Informações</a></p>
            <p><a href="">Ver trailer</a></p>
          </div>
          <div class="nome-filme">
            <p>Verity</p>
          </div>
          <button class="btn-filmes">Ingressos</button>
        </div>
        <div class="cards-filmes">
          <div class="cards-filmes-img-3">
            <p><a href="">Informações</a></p>
            <p><a href="">Ver trailer</a></p>
          </div>
          <div class="nome-filme">
            <p>Vingadores: Ultimato Encore</p>
          </div>
          <button class="btn-filmes">Ingressos</button>
        </div>
        <div class="cards-filmes">
          <div class="cards-filmes-img-4">
            <p><a href="">Informações</a></p>
            <p><a href="">Ver trailer</a></p>
          </div>
          <div class="nome-filme">
            <p>A Origem</p>
          </div>
          <button class="btn-filmes">Ingressos</button>
        </div>
        <div class="cards-filmes">
          <div class="cards-filmes-img-5">
            <p><a href="">Informações</a></p>
            <p><a href="">Ver trailer</a></p>
          </div>
          <div class="nome-filme">
            <p>Top Gun: Maverick</p>
          </div>
          <button class="btn-filmes">Ingressos</button>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
